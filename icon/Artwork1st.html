<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karya Icon Interaktif</title>
    <style>
        /* === FONTS & RESET === */
        @font-face {
            font-family: 'CooperHewitt';
            src: url('CooperHewitt-Book.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Jester';
            src: url('Jester-19-SUN.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background: #FFFFFF;
            overflow: hidden;
            font-family: 'CooperHewitt', sans-serif;
            position: relative;
        }

        /* === TITLE TENGAH === */
        #main-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Jester', serif;
            font-size: clamp(1.8rem, 6.5vw, 6rem);
            color: #E3331F;
            letter-spacing: 0.1em;
            white-space: nowrap;
            mix-blend-mode: multiply;
            z-index: 5;
            pointer-events: none;
            user-select: none;
            text-align: center;
        }

        /* === SIDEBAR TOGGLE BUTTON === */
        #toggle-sidebar {
            position: fixed;
            top: 22px;
            left: 22px;
            z-index: 1001;
            font-family: 'CooperHewitt', sans-serif;
            font-size: 0.52rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            border: 1px solid rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.92);
            color: rgba(0,0,0,0.4);
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #toggle-sidebar:hover {
            border-color: #E3331F;
            color: #E3331F;
        }

        #toggle-sidebar.sidebar-open {
            border-color: #E3331F;
            background: #E3331F;
            color: #fff;
        }

        /* === SIDEBAR === */
        #sidebar {
            position: fixed;
            left: -300px;
            top: 0;
            width: 260px;
            height: 100%;
            background: rgba(255,255,255,0.96);
            border-right: 1px solid rgba(227,51,31,0.25);
            transition: left 0.3s ease-in-out;
            z-index: 1000;
            overflow-y: auto;
            padding: 72px 20px 20px 20px;
        }

        #sidebar.active {
            left: 0;
        }

        #sidebar::-webkit-scrollbar {
            width: 3px;
        }
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: rgba(227,51,31,0.35);
        }

        /* Sidebar heading */
        #sidebar-heading {
            font-family: 'CooperHewitt', sans-serif;
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(0,0,0,0.25);
            margin-bottom: 16px;
        }

        #sidebar ul {
            list-style: none;
        }

        #sidebar li {
            margin-bottom: 0;
            cursor: pointer;
            font-family: 'CooperHewitt', sans-serif;
            font-size: 12px;
            letter-spacing: 0.04em;
            color: rgba(0,0,0,0.55);
            transition: color 0.18s;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            padding: 8px 0;
            -webkit-tap-highlight-color: transparent;
        }

        #sidebar li:hover {
            color: #E3331F;
        }

        /* === CANVAS LAYERS === */
        #poop-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        /* === ARTWORK ICONS === */
        .artwork {
            position: absolute;
            width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: grab;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: none;
        }

        .artwork:active {
            cursor: grabbing;
        }

        .artwork:hover, .artwork.hover-active {
            z-index: 100;
        }

        .icon-img {
            width: 115px;
            height: 115px;
            object-fit: contain;
            filter: url('#screen-red');
            transition: transform 0.3s ease;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .artwork:hover .icon-img, .artwork.hover-active .icon-img {
            filter: none;
            transform: scale(1.1);
        }

        .text {
            font-family: 'CooperHewitt', sans-serif;
            font-size: 11px;
            letter-spacing: 0.06em;
            color: rgba(0,0,0,0.45);
            margin-top: 8px;
            line-height: 1.55;
            pointer-events: none;
            text-transform: uppercase;
        }

        .artwork:hover .text, .artwork.hover-active .text {
            color: #E3331F;
        }

        /* === BUG (KUMBANG) === */
        #bug {
            position: absolute;
            width: 80px;
            height: auto;
            pointer-events: none;
            z-index: 999;
            filter: url('#screen-red');
        }

        /* === PLAYING BORDER (konsisten dgn homepage) === */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            border: 1px solid rgba(227,51,31,0.10);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position: absolute; z-index: -1;">
        <defs>
            <filter id="screen-red" color-interpolation-filters="sRGB">
                <feColorMatrix type="saturate" values="0" in="SourceGraphic" result="GRAYSCALE" />
                
                <feFlood flood-color="#E3331F" result="COLOR" />
                
                <feBlend mode="screen" in="COLOR" in2="GRAYSCALE" result="BLENDED" />
                
                <feComposite in="BLENDED" in2="SourceAlpha" operator="in" />
            </filter>
        </defs>
    </svg>

    <button id="toggle-sidebar">☰</button>
    <div id="sidebar">
        <div id="sidebar-heading">Artworks</div>
        <ul id="karya-list"></ul>
    </div>
    
    <div id="main-title">ARTWORK</div>

    <canvas id="poop-canvas"></canvas>

    <div id="canvas"></div>
    
    <img id="bug" src="bug-walk.gif" alt="Bug">

    <script>
        // 1. DATA KARYA
        const karyaData = [
            { year: '2017', title: 'Communication Breakdown', file: 'ComBre.png' },
            { year: '2017', title: 'Proyek Rekapitulasi Senyum', file: 'smile.png' },
            { year: '2018', title: 'Komposisi Hewani', file: 'KompHew.png' },
            { year: '2018', title: 'Sarung', file: 'sarung.png' },
            { year: '2019', title: 'Klinik Alternatip "Pixel Scan"', file: 'klinik.png' },
            { year: '2019', title: 'Oxymeter Fog', file: 'oxy.png' },
            { year: '2019', title: 'Private (Public) Data', file: 'agree.png' },
            { year: '2019', title: 'River View Simulation', file: 'rvs.png' },
            { year: '2020', title: 'DJ MI$$$KIN', file: 'djmiskin.png' },
            { year: '2020', title: 'Kydunk Cyberpunk', file: 'kydunk.png' },
            { year: '2021', title: 'Modular Miskin', file: 'Miskin Moduar.png' },
            { year: '2021', title: 'Singup', file: 'mbo.png' },
            { year: '2022', title: 'Borongan', file: 'Kuproy.png' },
            { year: '2022', title: 'Penduso Table Game', file: 'penduso.png' },
            { year: '2023', title: 'Bengox', file: 'bengox.png' },
            { year: '2023', title: 'Kabesha', file: 'kabe.png' },
            { year: '2023', title: 'Oprex Budoyo', file: 'oprex.png' },
            { year: '2024', title: 'Adblock', file: 'adblock.jpg' },
            { year: '2024', title: 'Anti Idol', file: 'Anti Idol.jpeg' },
            { year: '2024', title: 'PKL', file: 'pkl.png' },
            { year: '2024', title: 'POV JATIM', file: 'POV.png' },
            { year: '2025', title: 'Awikworks Sintesis', file: 'Sintesis.png' },
            { year: '2025', title: 'Bocil Kematian', file: 'kenzo.png' },
            { year: '2025', title: 'MTN LAB', file: 'mtn.png' },
            { year: '2025', title: 'Sukatani Matches', file: 'sukatani.png' },
            { year: '2026', title: 'BLOT', file: 'blot.png' },
            { year: '2026', title: 'AMPRRRONG... (Bytebeat)', file: 'bytebeat.png' },
            { year: '2026', title: 'Pasax Bumi Sintesis', file: 'pasax.png' },
            { year: '2026', title: 'WALI X', file: 'walix.png' }
        ];

        karyaData.reverse(); // Tahun terbaru (2026) di paling atas

        let width = window.innerWidth;
        let height = window.innerHeight;
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            poopCanvas.width = width;
            poopCanvas.height = height;
        });

        // 2. INISIALISASI UI
        const canvas = document.getElementById('canvas');
        const listContainer = document.getElementById('karya-list');
        const sidebarToggle = document.getElementById('toggle-sidebar');
        const sidebar = document.getElementById('sidebar');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            let isSidebarOpen = sidebar.classList.contains('active');
            
            if (isSidebarOpen) {
                sidebarToggle.innerHTML = "✕";
                sidebarToggle.classList.add('sidebar-open');
                items.forEach(item => {
                    if (item.x < 320) { 
                        item.vx += (350 - item.x) * 0.1; 
                        item.vy += (Math.random() - 0.5) * 5; 
                        item.vAngle += (Math.random() - 0.5) * 10;
                    }
                });
            } else {
                sidebarToggle.innerHTML = "☰";
                sidebarToggle.classList.remove('sidebar-open');
            }
        });

        const items = karyaData.map((data) => {
            // Pembuatan Element List Sidebar
            const li = document.createElement('li');
            li.innerHTML = `<strong>${data.year}</strong> - ${data.title}`;
            listContainer.appendChild(li);

            // Pembuatan Element Icon di Kanvas
            const el = document.createElement('div');
            el.className = 'artwork';
            el.innerHTML = `
                <img class="icon-img" src="${data.file}" alt="${data.title}">
                <div class="text">${data.year}<br>${data.title}</div>
            `;
            canvas.appendChild(el);

            let itemData = {
                el: el,
                x: Math.random() * (width - 160),
                y: Math.random() * (height - 160),
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                angle: Math.random() * 360,
                vAngle: (Math.random() - 0.5),
                isDragging: false,
                hasDragged: false
            };

            // Event List Sidebar (Hover Effect ke Icon)
            li.addEventListener('mouseenter', () => {
                el.classList.add('hover-active'); // Memicu transisi warna asli icon
            });
            li.addEventListener('mouseleave', () => {
                el.classList.remove('hover-active');
            });
            // Event Klik dari Sidebar (Membuka detail)
            li.addEventListener('click', () => {
                alert('Membuka detail karya:\n' + data.year + ' - ' + data.title);
            });

            // Event Klik dari Icon di Kanvas
            el.addEventListener('click', (e) => {
                if (itemData.hasDragged) {
                    e.preventDefault();
                    return;
                }
                alert('Membuka detail karya:\n' + data.year + ' - ' + data.title);
            });

            return itemData;
        });

        // 3. FITUR DRAG DAN LEMPAR (THROW)
        let activeDragItem = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        function startDrag(e, item) {
            activeDragItem = item;
            item.isDragging = true;
            item.hasDragged = false; 
            item.el.style.zIndex = 1000;
            
            dragOffsetX = e.clientX - item.x;
            dragOffsetY = e.clientY - item.y;
            
            item.vx = 0; 
            item.vy = 0;
        }

        function moveDrag(clientX, clientY) {
            if (activeDragItem) {
                activeDragItem.hasDragged = true; 
                let targetX = clientX - dragOffsetX;
                let targetY = clientY - dragOffsetY;
                
                activeDragItem.vx = targetX - activeDragItem.x;
                activeDragItem.vy = targetY - activeDragItem.y;
                
                activeDragItem.x = targetX;
                activeDragItem.y = targetY;
            }
        }

        // Mouse Drag Events
        items.forEach(item => {
            item.el.addEventListener('mousedown', (e) => {
                e.preventDefault(); 
                startDrag(e, item);
            });
        });

        window.addEventListener('mousemove', (e) => {
            moveDrag(e.clientX, e.clientY);
        });

        // Touch Drag Events
        items.forEach(item => {
            item.el.addEventListener('touchstart', (e) => {
                startDrag(e.touches[0], item);
            }, {passive: false});
        });

        window.addEventListener('touchmove', (e) => {
            if(activeDragItem) e.preventDefault(); 
            moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        function endDrag() {
            if (activeDragItem) {
                activeDragItem.isDragging = false;
                activeDragItem.el.style.zIndex = ''; 
                
                let tempItem = activeDragItem;
                setTimeout(() => { tempItem.hasDragged = false; }, 50);
                
                activeDragItem = null;
            }
        }

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);


        // 4. SETUP KUMBANG ALAMI
        const bugEl = document.getElementById('bug');
        let bug = {
            x: width / 2,
            y: height / 2,
            angle: Math.random() * Math.PI * 2,
            speed: 1.0,  
            wander: 0
        };

        const poopCanvas = document.getElementById('poop-canvas');
        const ctx = poopCanvas.getContext('2d');
        poopCanvas.width = width;
        poopCanvas.height = height;
        let poops = [];

        // 5. ANIMATION ENGINE
        function animate() {
            // A. UPDATE POOP
            ctx.clearRect(0, 0, width, height);
            for (let i = poops.length - 1; i >= 0; i--) {
                let p = poops[i];
                p.life -= 0.003; 
                
                if (p.life <= 0) {
                    poops.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.life * 0.7; 
                    ctx.fillStyle = "#E3331F"; 
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "#E3331F"; 
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // B. UPDATE GERAKAN KUMBANG
            bug.wander += (Math.random() - 0.5) * 0.4;
            bug.angle += bug.wander * 0.2;
            bug.wander *= 0.9; 

            bug.x += Math.cos(bug.angle) * bug.speed;
            bug.y += Math.sin(bug.angle) * bug.speed;

            let bugRadius = 40; 
            if (bug.x < bugRadius) { bug.x = bugRadius; bug.angle = Math.PI - bug.angle; }
            if (bug.x > width - bugRadius) { bug.x = width - bugRadius; bug.angle = Math.PI - bug.angle; }
            if (bug.y < bugRadius) { bug.y = bugRadius; bug.angle = -bug.angle; }
            if (bug.y > height - bugRadius) { bug.y = height - bugRadius; bug.angle = -bug.angle; }

            bugEl.style.left = bug.x + 'px';
            bugEl.style.top = bug.y + 'px';
            bugEl.style.transform = `translate(-50%, -50%) rotate(${(bug.angle * 180 / Math.PI) + 90}deg)`;

            // C. KUMBANG POOP
            if (Math.random() < 0.03) {
                let dropX = bug.x - Math.cos(bug.angle) * 30;
                let dropY = bug.y - Math.sin(bug.angle) * 30;
                poops.push({
                    x: dropX, y: dropY, life: 1.0, size: Math.random() * 2 + 1.5 
                });
            }

            // D. UPDATE PERGERAKAN ICON & BATAS SIDEBAR
            let isSidebarOpen = sidebar.classList.contains('active');
            let leftWall = isSidebarOpen ? 280 : 0; 

            items.forEach(item => {
                if (!item.isDragging) {
                    let iconCenterX = item.x + 80; 
                    let iconCenterY = item.y + 80;

                    let distToBugX = iconCenterX - bug.x;
                    let distToBugY = iconCenterY - bug.y;
                    let distanceToBug = Math.sqrt(distToBugX * distToBugX + distToBugY * distToBugY);

                    let pushRadius = 140; 
                    if (distanceToBug < pushRadius) {
                        let force = (pushRadius - distanceToBug) / pushRadius;
                        item.vx += (distToBugX / distanceToBug) * force * 1.2;
                        item.vy += (distToBugY / distanceToBug) * force * 1.2;
                        item.vAngle += (Math.random() - 0.5) * force * 3;
                    }

                    item.x += item.vx;
                    item.y += item.vy;
                    item.angle += item.vAngle;

                    item.vx *= 0.985;
                    item.vy *= 0.985;
                    item.vAngle *= 0.98;

                    if (Math.abs(item.vx) < 0.2) item.vx += (Math.random() - 0.5) * 0.06;
                    if (Math.abs(item.vy) < 0.2) item.vy += (Math.random() - 0.5) * 0.06;
                    if (Math.abs(item.vAngle) < 0.1) item.vAngle += (Math.random() - 0.5) * 0.02;

                    let itemW = 160; 
                    let itemH = 160;
                    
                    if (item.x < leftWall) { 
                        item.x = leftWall; 
                        item.vx = Math.abs(item.vx) + 0.5; 
                    }
                    if (item.x > width - itemW) { item.x = width - itemW; item.vx *= -1; }
                    if (item.y < 0) { item.y = 0; item.vy *= -1; }
                    if (item.y > height - itemH) { item.y = height - itemH; item.vy *= -1; }
                }

                item.el.style.left = item.x + 'px';
                item.el.style.top = item.y + 'px';
                item.el.style.transform = `rotate(${item.angle}deg)`;
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
